services:
  - type: web
    name: sentimentiq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DEVICE
        value: cpu
      - key: LOG_LEVEL
        value: INFO
      # Set CORS_ORIGINS as a JSON array string, e.g.:
      # ["https://your-app.vercel.app","http://localhost:5173"]
      - key: CORS_ORIGINS
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_PASSWORD
        sync: false
      - key: INSTAGRAM_SESSION_ID
        sync: false
